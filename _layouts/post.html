---
layout: default
---

<div class="has-fixed-nav">
  <main id="main-content" class="post">
    <article class="post-article">
      <p class="post-back"><a href="/blog/">&larr; All recaps</a></p>
      <header class="post-header">
        <h1 class="page-title">{{ page.title }}</h1>
        <p class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
          {% if page.discourse_url %}· Adapted from <a href="{{ page.discourse_url }}">{{ page.author }}'s recap</a>{% elsif page.author %}· Written by {{ page.author }}{% endif %}
        </p>
      </header>
      <div class="post-content">{{ content }}</div>
    </article>
  </main>
  {% include footer.html %}
</div>
