---
media:
  input: public/images
  output: /images
  categories: [image]

components:
  button:
    type: object
    label: Button
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: url
        label: Link
        type: string
        required: true
      - name: style
        label: Style
        type: select
        default: primary
        options:
          values: [primary, secondary]
  link:
    type: object
    label: Link
    fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: url
        label: Link
        type: string
        required: true
  image:
    type: object
    label: Image
    fields:
      - name: src
        label: Image (leave empty to show a "photo to come" placeholder)
        type: image
      - name: alt
        label: Alt text (describe the photo for people who can't see it)
        type: string
  background:
    type: select
    label: Background
    default: auto
    options:
      values: [auto, cream, white, deep]
  anchor:
    type: string
    label: Anchor (optional; lowercase-with-dashes, so /about/#partners links here)
    pattern:
      regex: ^[a-z0-9-]*$
      message: Use lowercase letters, numbers and dashes
  list_style:
    type: select
    label: List markers
    default: bullets
    options:
      values: [bullets, shapes, checks, squares]
  card:
    type: object
    label: Side card
    fields:
      - { name: title, label: Window title, type: string }
      - { name: heading, label: Heading, type: string }
      - { name: body, label: Text, type: rich-text }
      - { name: items, label: "List items (**bold** and [links](/url) work)", type: string, list: true }
      - { name: list_style, component: list_style }
      - name: widget
        label: Extra
        type: select
        default: none
        options:
          values: [none, ledger, donate]
      - { name: button, label: Button, component: button }
      - { name: note, label: Small note at the bottom, type: string }

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    view:
      fields: [title]
      primary: title
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Description (for search engines and link previews)
        type: text
      - name: sections
        label: Sections
        type: block
        list: true
        blockKey: type
        blocks:
          - name: hero
            label: Hero (home page)
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: lines, label: Headline lines (up to 3), type: string, list: { max: 3 } }
              - { name: intro, label: Intro, type: text }
              - { name: buttons, label: Buttons, component: button, list: { max: 2 } }
              - { name: image, label: Photo, component: image }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: page_title
            label: Page title
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: intro, label: Intro, type: text }
              - { name: image, label: Photo (optional), component: image }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: explainer
            label: Video and bullets
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: body, label: Text, type: rich-text }
              - { name: bullets, label: Bullet points (up to 3), type: string, list: { max: 3 } }
              - name: video
                label: Video
                type: object
                fields:
                  - { name: title, label: Caption, type: string }
                  - { name: url, label: Video link, type: string }
                  - { name: poster, label: Poster image, type: image }
                  - { name: status, label: Status badge, type: string }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: hack_night
            label: Hacknight agenda + next event
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: intro, label: Intro, type: text }
              - name: agenda
                label: Agenda
                type: object
                list: true
                fields:
                  - { name: time, label: Time (PM), type: string, required: true }
                  - { name: title, label: Title, type: string, required: true }
                  - { name: text, label: Description, type: string }
                  - name: icon
                    label: Icon
                    type: select
                    options:
                      values: [pizza, megaphone, list, laptop, flag, chat]
                  - { name: optional, label: Optional, type: boolean }
              - { name: image, label: Photo (shown if there's no card), component: image }
              - { name: card, label: Side card (replaces the next-event window), component: card }
              - { name: details, label: Text under the card, type: rich-text }
              - { name: button, label: Button, component: button }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: season
            label: Season tracker + upcoming nights
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: lead, label: Lead sentence, type: string }
              - { name: body, label: Text, type: rich-text }
              - { name: link, label: Link, component: link }
              - { name: image, label: Photo, component: image }
              - { name: caption, label: Photo caption, type: string }
              - { name: upcoming_heading, label: Upcoming nights heading, type: string }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: projects
            label: Projects that need help
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: button, label: Button, component: link }
              - { name: limit, label: How many projects, type: number, default: 3 }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: gallery
            label: Photo gallery
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: button, label: Button, component: link }
              - { name: window_title, label: Window title, type: string }
              - { name: images, label: Photos, component: image, list: { max: 8 } }
              - { name: link, label: Photos link to, type: string }
              - { name: note, label: Small note under the photos, type: string }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: cta
            label: Call to action band
            fields:
              - { name: heading, label: Heading (Enter for a new line), type: text, required: true }
              - { name: body, label: Text, type: rich-text }
              - { name: buttons, label: Buttons, component: button, list: { max: 2 } }
              - { name: card, component: card }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: text_cta
            label: Text with a button
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: body, label: Text, type: rich-text }
              - { name: button, label: Button, component: button }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: media_text
            label: Photo and text
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: lead, label: Big statement, type: text }
              - { name: items_heading, label: List heading, type: string }
              - { name: items, label: "List items (**bold** and [links](/url) work)", type: string, list: true }
              - { name: list_style, component: list_style }
              - { name: body, label: Text, type: rich-text }
              - { name: image, label: Photo, component: image }
              - { name: card, label: Side card (the photo moves under the text), component: card }
              - name: image_side
                label: Photo side
                type: select
                default: right
                options:
                  values: [left, right]
              - { name: buttons, label: Buttons, component: button, list: { max: 2 } }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: text
            label: Text
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: body, label: Text, type: rich-text, required: true }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: post_list
            label: Blog post list (blog page only)
            fields:
              - { name: window_title, label: Window title, type: string }
              - { name: page_size, label: Posts per page, type: number, default: 8 }
              - name: filters
                label: Filter buttons
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string, required: true }
                  - { name: tag, label: Tag it filters by, type: string, required: true }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: cards
            label: Cards (windows or coloured tiles)
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: intro, label: Intro, type: text }
              - name: style
                label: Style
                type: select
                default: window
                options:
                  values: [window, tile]
              - { name: columns, label: Columns (2–4), type: number, default: 3, options: { min: 2, max: 4 } }
              - name: cards
                label: Cards
                type: object
                list: true
                fields:
                  - { name: title, label: Window title (windows only), type: string }
                  - { name: tag, label: Tag (windows only), type: string }
                  - { name: heading, label: Heading, type: string }
                  - { name: body, label: Text, type: rich-text }
                  - { name: items, label: List items, type: string, list: true }
                  - { name: note, label: "Boxed note (**bold** works)", type: string }
                  - { name: link, label: Link, component: link }
                  - { name: highlight, label: Highlight (dark blue), type: boolean }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: project_list
            label: Project list (active or past)
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: intro, label: Intro, type: text }
              - name: show
                label: Show
                type: select
                default: active
                options:
                  values: [active, past]
              - { name: filters, label: Skill filter buttons, type: boolean }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: steps
            label: Numbered steps
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - name: steps
                label: Steps
                type: object
                list: true
                fields:
                  - { name: heading, label: Heading, type: string, required: true }
                  - { name: body, label: Text, type: text }
              - { name: buttons, label: Buttons, component: button, list: { max: 2 } }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: partners
            label: Partner logos
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: note, label: Note under the logos, type: rich-text }
              - { name: show_previous, label: Also show past partners, type: boolean }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: links
            label: Row of link buttons
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: links, label: Links, component: link, list: true }
              - { name: background, component: background }
              - { name: anchor, component: anchor }
          - name: season_timeline
            label: Season timeline
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: intro, label: Intro, type: text }
              - { name: background, component: background }
              - { name: anchor, component: anchor }

  - name: site
    label: Site settings
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - { name: header_button, label: Header button, component: link }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: tagline, label: Tagline, type: text }
          - { name: button, label: Button, component: link }
          - name: groups
            label: Link columns
            type: object
            list: { max: 4 }
            fields:
              - { name: title, label: Column title, type: string }
              - { name: links, label: Links, component: link, list: true }
          - { name: copyright, label: Copyright name, type: string }
          - { name: badge, label: Badge text, type: string }
      - { name: luma_calendar, label: Luma calendar link, type: string }
      - { name: open_collective, label: Open Collective page (donations and the public ledger), type: string }

  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: author
        label: Author
        type: string
      - name: summary
        label: Summary (1–2 sentences for the blog list; leave empty to use the first paragraph)
        type: text
      - name: tags
        label: Tags
        type: select
        list: true
        options:
          creatable: true
          values: [Recap, Guest speaker, Talk, Pitch night, Planning, Project updates, Project story, Showcase, Methods, Projects, In the news, News, Events]
      - name: image
        label: Cover image
        type: image
      - name: season
        label: Season
        type: number
      - name: week
        label: Week
        type: number
      - name: discourse_url
        label: Discourse thread
        type: string
      - name: draft
        label: Draft (hide from the site)
        type: boolean
        default: false
      - name: body
        label: Post
        type: rich-text

  - name: season
    label: This season
    type: file
    path: _data/season.yml
    format: yaml
    fields:
      - name: name
        label: Season name
        type: string
        required: true
      - name: current_week
        label: Current week (bump each Wednesday)
        type: number
        required: true
      - name: weeks
        label: Week-by-week phases
        type: select
        list: true
        options:
          values: [pitch, ideation, planning, build, user, finish, prep, showcase]
      - name: notes
        label: Notes for upcoming hacknights
        type: object
        list: true
        fields:
          - name: week
            label: Week
            type: number
          - name: text
            label: Note
            type: text


  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [name, status, active]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: active
        label: Active this season (untick to move it to Past projects)
        type: boolean
        default: true
      - name: status
        label: Status label (shown on the card, e.g. "Active · Season 9")
        type: string
      - name: summary
        label: Short summary (one sentence, for cards and the top of the page)
        type: text
      - name: logo
        label: Image
        type: image
      - name: url
        label: Website
        type: string
      - name: github
        label: GitHub repo
        type: string
      - name: year
        label: Years
        type: number
        list: true
      - name: role
        label: Our role
        type: string
        list: true
      - name: needs
        label: Help wanted (active projects with this filled in show on the home page)
        type: string
        list: true
      - name: skills
        label: Skills (for the filter buttons on the Projects page)
        type: select
        list: true
        options:
          values: [design, code, data, research, outreach]
      - name: fund
        label: Funding link
        type: string
      - name: problem
        label: Problem (past projects)
        type: text
      - name: outcome
        label: Outcome (past projects)
        type: text
      - name: order
        label: Order (lower comes first)
        type: number
        default: 100
      - name: body
        label: About the project
        type: rich-text

  - name: updates
    label: Project updates
    type: collection
    path: src/content/updates
    filename: "{year}-{month}-{day}-{fields.project}.md"
    view:
      fields: [date, project]
      primary: project
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: project
        label: Project
        type: reference
        required: true
        options:
          collection: projects
          value: "{primary}"
          label: "{primary}"
      - name: date
        label: Date (the hacknight it's about)
        type: date
        required: true
      - name: body
        label: Update
        type: rich-text

  - name: partners
    label: Partners
    type: file
    path: _data/partners.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        path: sponsors
      - name: current
        label: Current partner
        type: boolean

  - name: navigation
    label: Navigation menu
    type: file
    path: _data/navigation.yml
    format: yaml
    list: true
    fields:
      - name: text
        label: Label
        type: string
        required: true
      - name: url
        label: Link
        type: string
        required: true
